<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parquet file requests</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#192c43;font:14px/1.45 system-ui,sans-serif}main{max-width:1180px;margin:0 auto;padding:24px 18px}.selector{display:flex;align-items:end;flex-wrap:wrap;gap:16px;margin-bottom:18px}.control label{display:block;margin-bottom:5px}.file-control{flex:1;min-width:220px}.file-control select{width:100%}select{max-width:100%;color-scheme:light;color:#192c43;background-color:#fff}select option{color:#192c43;background-color:#fff}select{font:inherit;font-size:16px;padding:8px 36px 8px 12px;border:1px solid #b9c7d8;border-radius:7px;background:white}#graph{background:white;border:1px solid #dce3ed;border-radius:10px;overflow-x:auto}svg{display:block;width:100%;min-width:680px;height:auto}svg .range{fill:#2677af;fill-opacity:.58;stroke:#2677af;stroke-width:.8}svg .hit{fill:transparent;stroke:none;cursor:pointer}svg .head{stroke:#687a91;stroke-width:3}svg g.active .range{fill:#e18a16;fill-opacity:.9;stroke:#a15d00;stroke-width:2}svg g.active .head{stroke:#e18a16;stroke-width:5}svg g:focus{outline:none}svg .active .marker{stroke:#e18a16;stroke-width:1}.table-wrap{background:white;margin-top:20px;border:1px solid #dce3ed;border-radius:10px;overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:10px 14px;text-align:right;border-bottom:1px solid #e3e9f1}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}thead{position:sticky;top:0;background:#edf2f8;z-index:1}tbody tr{cursor:pointer}tbody tr.active{background:#fff0d8;box-shadow:inset 4px 0 #e18a16}tbody tr:focus{outline:2px solid #e18a16;outline-offset:-2px}@media(max-width:600px){main{padding:16px 10px}th,td{padding:9px 10px}}
</style></head><body><main><div class="selector"><div class="control"><label for="engine">Engine</label><select id="engine"></select></div><div class="control file-control"><label for="file">File</label><select id="file"></select></div></div><div id="graph"></div><div class="table-wrap" id="table-wrap"><table><thead><tr><th>Request</th><th>Method</th><th>Byte range</th><th>Bytes</th><th>Start since beginning (ms)</th><th>End since beginning (ms)</th></tr></thead><tbody id="requests"></tbody></table></div></main><script type="application/json" id="data">__PLANK_REQUEST_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),select=document.getElementById('engine'),fileSelect=document.getElementById('file'),graph=document.getElementById('graph'),table=document.getElementById('requests'),wrap=document.getElementById('table-wrap'),fmt=n=>n.toLocaleString('en-US'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=null;
select.innerHTML=data.files[0].engines.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');
select.value=String(Math.max(0,data.files[0].engines.findIndex(e=>!e.error)));
fileSelect.innerHTML=data.files.map((f,i)=>`<option value="${i}">${esc(f.label)}</option>`).join('');
function highlight(id,fromGraph=false){if(active!==null)document.querySelectorAll(`[data-request="${active}"]`).forEach(e=>e.classList.remove('active'));active=id;if(id!==null){document.querySelectorAll(`[data-request="${id}"]`).forEach(e=>e.classList.add('active'));if(fromGraph){const row=table.querySelector(`[data-request="${id}"]`);if(row){const top=row.offsetTop,bottom=top+row.offsetHeight;if(top<wrap.scrollTop+42||bottom>wrap.scrollTop+wrap.clientHeight)wrap.scrollTop=Math.max(0,top-wrap.clientHeight/2)}}}}
function render(){active=null;const file=data.files[Number(fileSelect.value)],engine=file.engines[Number(select.value)],rs=engine.requests,W=1080,H=690,L=100,R=32,T=70,B=30,w=W-L-R,h=H-T-B,total=Math.max(1,engine.elapsed_ms,...rs.map(r=>r.time+r.duration))*1.02,x=b=>L+w*b/file.size,y=t=>T+h*t/total;Array.from(select.options).forEach((option,i)=>{const e=file.engines[i];option.textContent=e.name+(e.error?' — '+e.error:'')});let svg='';for(let i=0;i<=4;i++){const byte=Math.round(file.size*i/4),xx=x(byte);svg+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="#e0e7f0"/><text x="${xx}" y="${T-20}" text-anchor="${i===0?'start':i===4?'end':'middle'}" font-size="13" fill="#53677c">${fmt(byte)}</text>`}for(let i=0;i<=5;i++){const t=total*i/5,yy=y(t);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e0e7f0"/><text x="${L-12}" y="${yy+4}" text-anchor="end" font-size="13" fill="#53677c">${t.toFixed(0)}</text>`}svg+=`<text x="${L+w/2}" y="25" text-anchor="middle" font-size="15" fill="#192c43">File byte offset</text><text transform="translate(22 ${T+h/2}) rotate(-90)" text-anchor="middle" font-size="15" fill="#192c43">Time since beginning (ms) ↓</text>`;rs.filter(r=>r.method!=='HEAD').forEach(r=>{const yy=y(r.time),height=Math.max(.8,y(r.time+r.duration)-yy),title=`#${r.id+1} ${r.method} · ${r.start===null||r.start===undefined?'no byte range':fmt(r.start)+'–'+fmt(r.end)} · ${r.time.toFixed(2)}–${(r.time+r.duration).toFixed(2)} ms since beginning`;let shape;if(r.start===null||r.start===undefined){shape=`<line class="head" x1="${L}" x2="${L}" y1="${yy}" y2="${yy+height}"/><rect class="hit" x="${L-6}" y="${yy}" width="12" height="${Math.max(8,height)}"/>`}else{const xx=x(r.start),width=x(r.end+1)-xx;shape=`<rect class="range" x="${xx}" y="${yy}" width="${width}" height="${height}"/><rect class="hit" x="${xx-Math.max(0,(8-width)/2)}" y="${yy-Math.max(0,(8-height)/2)}" width="${Math.max(8,width)}" height="${Math.max(8,height)}"/>`}svg+=`<g data-request="${r.id}" tabindex="0" aria-label="${title}"><title>${title}</title>${shape}</g>`});graph.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="File bytes horizontally, requests in time from top to bottom">${svg}</svg>`;table.innerHTML=rs.map(r=>`<tr data-request="${r.id}" tabindex="0"><td>${r.id+1}</td><td>${r.method}</td><td>${r.start===null||r.start===undefined?'—':fmt(r.start)+'–'+fmt(r.end)}</td><td>${fmt(r.bytes)}</td><td>${r.time.toFixed(2)}</td><td>${(r.time+r.duration).toFixed(2)}</td></tr>`).join('');wrap.scrollTop=0;}
for(const area of [graph,table]){area.addEventListener('pointerover',e=>{const row=e.target.closest('[data-request]');if(row)highlight(row.dataset.request,area===graph)});area.addEventListener('pointerout',e=>{const next=e.relatedTarget?.closest?.('[data-request]');if(!next)highlight(null)});area.addEventListener('focusin',e=>{const row=e.target.closest('[data-request]');if(row)highlight(row.dataset.request,area===graph)});area.addEventListener('focusout',()=>highlight(null));area.addEventListener('click',e=>{const row=e.target.closest('[data-request]');if(row)highlight(row.dataset.request,area===graph)})}
select.addEventListener('change',render);fileSelect.addEventListener('change',render);render();
</script></body></html>
