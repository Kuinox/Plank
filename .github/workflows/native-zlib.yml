name: Native zlib

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish 32-bit native tests
        run: >-
          dotnet publish Plank.Tests/Plank.Tests.csproj
          --configuration Release --runtime win-x86 --self-contained true
          --output artifacts/native-tests

      - name: Exercise zlib in a 32-bit Windows process
        env:
          PLANK_EXPECTED_ARCHITECTURE: X86
        run: >-
          ./artifacts/native-tests/Plank.Tests.exe
          --treenode-filter "/*/Plank.Tests.NativeInterop/ZlibNativeTests/*"
