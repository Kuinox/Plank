name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check unshipped public API
        run: |
          diff --unified \
            --label expected \
            --label Plank/PublicAPI.Unshipped.txt \
            <(printf '#nullable enable\n') \
            Plank/PublicAPI.Unshipped.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution Plank.sln --configuration Release

  test-snappy-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Snappy on ARM64
        run: >-
          dotnet test --project Plank.Tests/Plank.Tests.csproj --configuration Release --
          --treenode-filter "/*/*/SnappyCodecTests/*" --no-progress
