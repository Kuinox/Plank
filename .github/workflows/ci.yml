name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check unshipped public API
        run: |
          diff --unified \
            --label expected \
            --label Plank/PublicAPI.Unshipped.txt \
            <(printf '#nullable enable\n') \
            Plank/PublicAPI.Unshipped.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --solution Plank.sln --configuration Release

      - name: Verify documentation samples
        run: dotnet run --project Samples/Plank.Sample --configuration Release
