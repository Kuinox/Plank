name: Focused PR regression audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_EnableAVX512F: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kuinox/Plank-Lab
          ref: 2d9c6091428015312957ed602a8f1472430927c7
          path: lab-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare exact revisions and build
        shell: bash
        run: |
          mkdir results
          lscpu > results/cpu.txt
          git clone --no-checkout https://github.com/Kuinox/Plank.git library-source
          for pair in base:510878c23d6eeaf762d1fba7f32a12bc896766cc pr93:aaa9f86d8ff53df404ba351762ad9a80aa50d7e0 pr94:f055378118fa1e45257a0c8d083608eadf5e24f3; do
            variant="${pair%%:*}"
            sha="${pair#*:}"
            mkdir "lab-$variant"
            git -C lab-source archive HEAD | tar -x -C "lab-$variant"
            rmdir "lab-$variant/library/Plank"
            git -C library-source worktree add --detach "$GITHUB_WORKSPACE/lab-$variant/library/Plank" "$sha"
            dotnet build "lab-$variant/Plank.Benchmarks/Plank.Benchmarks.csproj" -c Release > "results/build-$variant.log" 2>&1
          done
      - name: Sequential matched and unchanged-base controls
        shell: bash
        run: |
          index=0
          for variant in base pr93 pr94 base pr94 pr93 base base; do
            index=$((index+1))
            (
              cd "lab-$variant"
              dotnet Plank.Benchmarks/bin/Release/net10.0/Plank.Benchmarks.dll --published \
                --filter '*SyntheticInt32ByteStreamSplitPlankBenchmarks.Write' '*SyntheticInt32PlainPlankBenchmarks.Write' \
                --iterationCount 100 --warmupCount 0
            ) > "results/pass-$index-$variant.log" 2>&1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-regression-audit
          path: results
